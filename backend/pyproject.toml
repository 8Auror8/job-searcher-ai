[project]
name = "jobpilot-api"
version = "0.1.0"
description = "JobPilot AI - backend API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.120",
  "starlette>=1.3.1",  # security fixes (pip-audit)
  "uvicorn[standard]>=0.34",
  "sqlalchemy[asyncio]>=2.0.40,<2.1",
  "asyncpg>=0.30,<0.31",
  "aiosqlite>=0.21,<0.22",
  "alembic>=1.15,<1.17",
  "pydantic-settings>=2.8,<3",
  "email-validator>=2.2,<3",
  "argon2-cffi>=23.1,<26",
  "pyjwt[crypto]>=2.10,<3",
  "httpx>=0.28,<0.29",
  "slowapi>=0.1.9,<0.2",
  "structlog>=25.1,<26",
  "anthropic>=2.8,<3",
  "pypdf>=5.1,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=1.2",
  "pytest-cov>=6.0",
  "ruff>=0.11,<0.12",
  "mypy>=1.18,<3",
  "pip-audit>=2.7,<3",
]

[build-system]
requires = ["setuptools>=84.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"  # same as Docker/CI/production runtime
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["slowapi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]  # SQLAlchemy async runs code inside greenlets
omit = ["app/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
