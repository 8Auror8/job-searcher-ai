# Render Blueprint: https://render.com/docs/blueprint-spec
# Secrets marked "sync: false" are entered in the Render dashboard, never committed.
services:
  - type: web
    name: jobpilot-api
    runtime: docker
    rootDir: backend
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false   # Neon connection string: postgresql+asyncpg://...?ssl=require
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false   # https://<your-app>.vercel.app
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false   # https://<your-app>.vercel.app/api/auth/google/callback
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
